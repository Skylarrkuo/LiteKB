name: Build LiteKB image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        default: dev
        required: true
      media_nodes:
        description: Include media workflow nodes
        type: boolean
        default: false
      extended_providers:
        description: Include additional model providers
        type: boolean
        default: false
      local_model:
        description: Include the CPU local model runtime
        type: boolean
        default: false
      platforms:
        description: Target platforms
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/litekb
          tags: type=raw,value=${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_IMAGE_TAG=${{ inputs.tag }}
            LITEKB_MEDIA_NODES=${{ inputs.media_nodes && '1' || '0' }}
            LITEKB_EXTENDED_PROVIDERS=${{ inputs.extended_providers && '1' || '0' }}
            LITEKB_LOCAL_MODEL=${{ inputs.local_model && '1' || '0' }}
